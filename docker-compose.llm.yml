# docker-compose.llm.yml — optional layer: local bot-AI model for mod-ollama-chat.
#
# Starts Qwen3.6-35B-A3B in a llama.cpp Vulkan server container (`ac-llm`) and
# enables mod-ollama-chat on ac-worldserver via AC_* env overrides (env vars
# beat the conf files; see docs/server.md "Bot AI model").
#
# Appended to COMPOSE_FILE by `start-server.sh --with-llm`; stop-server.sh
# always includes it so `stop`/`down` also reap ac-llm.
#
# RAM: ac-llm caps at 48G and REPLACES the manual ~100G LLM — unload that one
# first (48G llama + ~20G WoW fits the host budget, both LLMs at once don't).
# Model/flag tuning reference:
# https://github.com/liuysh1985/ai-pc-practice (local-llm-servers.md, llama.cpp)
#
# worldserver reaches the model over the compose network at
# http://ac-llm:8080/v1/chat/completions (no host port needed). Host port 8090
# is published for debugging only — 8080 belongs to the other LLM servers.

services:
  ac-llm:
    container_name: ac-llm
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan
    restart: unless-stopped
    networks:
      - ac-network
    devices:
      - /dev/dri
    group_add:
      - "${LLM_VIDEO_GROUP_ID:-44}"
      - "${LLM_RENDER_GROUP_ID:-990}"
    volumes:
      - ${LLM_MODELS_DIR:-${HOME}/LLM_Practice/models/qwen36-35b-a3b}:/models:ro
    ports:
      - "${DOCKER_LLM_EXTERNAL_PORT:-8090}:8080"
    mem_limit: ${DOCKER_LLM_MEM_LIMIT:-48g}
    memswap_limit: ${DOCKER_LLM_MEM_LIMIT:-48g}
    command:
      - -m
      - /models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      - --alias
      - Qwen3.6-35B-A3B
      - --reasoning-budget
      - "0"
      - -ngl
      - "99"
      - -fa
      - "on"
      - -c
      - "65536"
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "2"
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --host
      - 0.0.0.0
      - --port
      - "8080"

  ac-worldserver:
    # AzerothCore reads AC_<OPTION_NAME> env vars for any conf option and they
    # override the conf files (worldserver logs "Found config value ... from
    # environment variable ..."). Key rule: prefix AC_, dots -> _, camelCase
    # split into _UPPER. So the module is on only when this layer is loaded;
    # conf/modules/mod_ollama_chat.conf stays at its safe Enable = 0 default.
    environment:
      AC_OLLAMA_CHAT_ENABLE: "${OLLAMA_CHAT_ENABLE:-1}"
      AC_OLLAMA_CHAT_PROVIDER: "${OLLAMA_CHAT_PROVIDER:-openai}"
      AC_OLLAMA_CHAT_URL: "${OLLAMA_CHAT_URL:-http://ac-llm:8080/v1/chat/completions}"
      AC_OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-Qwen3.6-35B-A3B}"
      AC_OLLAMA_CHAT_MAX_CONCURRENT_QUERIES: "${OLLAMA_CHAT_MAX_CONCURRENCY:-1}"
      # With a real LLM voicing the bots, silence the module's canned chatter.
      # Literal 0 (not host-env tunables): this bundle is deliberate, and the
      # env vars pin it even if the runtime playerbots.conf drifts.
      AC_PLAYERBOTS_ENABLE_BROADCASTS: "0"
      AC_PLAYERBOTS_RANDOM_BOT_TALK: "0"
      AC_PLAYERBOTS_RANDOM_BOT_EMOTE: "0"
      AC_PLAYERBOTS_RANDOM_BOT_SUGGEST_DUNGEONS: "0"
      AC_PLAYERBOTS_ENABLE_GREET: "0"
      AC_PLAYERBOTS_RANDOM_BOT_SAY_WITHOUT_MASTER: "0"
